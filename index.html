<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pavia Cricket Tournament 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="script.js" defer></script>
</head>
<body>

<div class="poster" id="poster">
  <div class="top-bar"></div>
  <div class="accent-lines"></div>

  <div class="content">

    <!-- HEADER (built by JS) -->
    <div class="header" id="header"></div>

    <!-- GROUPS PANEL -->
    <div class="section" id="groups-section">
      <div class="section-header">
        <div class="section-tag" id="groups-title">Groups</div>
        <div class="section-line"></div>
      </div>
    </div>
    <div class="groups-panel" id="groups-panel"></div>

    <!-- FILTER BAR -->
    <div class="filter-bar" id="filter-bar">
      <span class="filter-label" id="filter-label">Filter by team:</span>
      <select class="filter-select" id="team-filter">
        <option value="">All teams</option>
      </select>
      <button class="filter-clear-btn" onclick="clearFilter()">Show All</button>
    </div>

    <!-- GROUP STAGE -->
    <div class="section" id="section3-wrapper">
      <div class="section-header">
        <div class="section-tag" id="section3-title">Group Stage</div>
        <div class="section-line"></div>
      </div>
      <div id="group-matches"></div>
    </div>

    <!-- KNOCKOUT STAGE -->
    <div class="section" id="section4-wrapper">
      <div class="section-header">
        <div class="section-tag knockout" id="section4-title">🏆 Knockout Stage</div>
        <div class="section-line"></div>
      </div>
      <div id="knockout-matches"></div>
    </div>

    <!-- NOTES -->
    <div class="section" id="section6-wrapper">
      <div class="section-header">
        <div class="section-tag" id="section6-title">Notes</div>
        <div class="section-line"></div>
      </div>
      <div class="notes-section" id="notes-section"></div>
    </div>

    <!-- RULES ACCORDION -->
    <div class="rules-section" id="section7-wrapper">
      <button class="rules-toggle" id="rules-toggle" onclick="toggleRules()">
        <span id="section7-title">📋 Match Rules &amp; Regulations</span>
        <span class="rules-toggle-icon">▼</span>
      </button>
      <div class="rules-body" id="rules-body"></div>
    </div>

    <!-- UMPIRES ACCORDION -->
    <div class="umpires-section" id="section5-wrapper">
      <button class="umpires-toggle" id="umpires-toggle" onclick="toggleUmpires()">
        <span id="section5-title">🧑‍⚖️ Match Umpires</span>
        <span class="umpires-toggle-icon">▼</span>
      </button>
      <div class="umpires-body" id="umpires-body"></div>
    </div>

    <!-- CUSTOM SECTIONS (auto-rendered from config) -->
    <div id="custom-sections"></div>

    <!-- FOOTER -->
    <div class="footer">
      <div class="footer-flags">
        <span class="flag-emoji">🇮🇳</span>
        <span>India</span>
        <span style="color:rgba(255,255,255,0.2)">×</span>
        <span>Italy</span>
        <span class="flag-emoji">🇮🇹</span>
      </div>
      <div class="footer-tagline" id="footer-tagline"></div>
    </div>

  </div>
</div>

</body>
</html>
